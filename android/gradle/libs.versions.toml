[versions]
agp = "8.8.2"
kotlin = "2.0.0"
coreKtx = "1.16.0"
activity = "1.10.1"
webkit = "1.13.0"
vehicleSdk = "2.3.2"
sttSdk = "3.3.1"
ttsSdk = "3.3.1"
llmSdk = "2.1.3.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }
pleos-vehicle = { module = "ai.pleos.playground:Vehicle", version.ref = "vehicleSdk" }
pleos-stt = { module = "ai.pleos.playground:SpeechToText", version.ref = "sttSdk" }
pleos-tts = { module = "ai.pleos.playground:TextToSpeech", version.ref = "ttsSdk" }
pleos-llm = { module = "ai.pleos.playground:LLM", version.ref = "llmSdk" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
