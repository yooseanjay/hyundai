# Cloudflare Worker (무료 플랜) — Gemini 중계 서버
# 배포: npx wrangler deploy --config worker/wrangler.toml
# 키 등록: npx wrangler secret put GEMINI_API_KEY --config worker/wrangler.toml
name = "our-car-alive-ai"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# 방문자(IP)별 1분에 12번까지 (대화 1번 = 대답 + 목소리 2번)
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 12
  period = 60
